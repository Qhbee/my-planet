faq:
  title: Frequently Asked Questions
  description: Brief notes about this site, services and collaboration, and my personal habits.
  categories:
    - title: About This Website
      questions:
        - label: What is this site for?
          content: |
            A personal space focused chiefly on blog essays that also serves as a project showcase.
        - label: Privacy & Data
          content: |
            Most pages are static browsing content. Personally Identifiable Information (PII) is not collected from visitors unless strictly required for specific module features (e.g., account services).
            Data is processed only within the scope necessary for functional implementation and security maintenance. I personally commit to not privately accessing or repurposing any data, nor will I sell, disclose, or provide it to any third party.
    - title: Services, Pricing & Timelines
      questions:
        - label: What services do you offer?
          content: |
            I specialize in Full-stack web development, AI application development, statistical modeling and deep-learning algorithms.
        - label: What is your work process like?
          content: |
            My process is collaborative and iterative, typically involving stages like Discovery & Research, Ideation & Prototyping, User Testing, Visual Design, and close collaboration with development teams during implementation. I tailor the process based on project needs, always focusing on user-centered solutions.
        - label: Do you work with startups?
          content: |
            Absolutely! I enjoy working with startups pro bono in my spare time, provided the project is genuinely meaningful and aligns with my interests.
        - label: How much does a project typically cost?
          content: |
            Project costs vary based on scope, complexity, features, and timeline. For full development engagements, my engagements typically start around ¥5,000 RMB; with average projects ranging between ¥8,000 and ¥25,000. For consulting or specific design tasks, my day rate is ¥700.
        - label: What are your payment terms?
          content: |
            I generally require a 40% deposit to schedule the project and begin work, with the remaining 60% due upon successful project completion and delivery. I accept WeChat Pay and Alipay.
        - label: How long does a typical project take?
          content: |
            Timelines depend heavily on the project's scope and complexity. Smaller projects might take 3-4 weeks, while larger, more involved projects can range from 2 to 4 months. I always provide a detailed timeline estimate after the initial discovery phase.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes, for clients needing ongoing design support, feature development, or maintenance, I offer monthly retainer options tailored to specific needs. Let's discuss if this is something you're interested in.
    - title: About Me
      questions:
        - label: What do you enjoy most about your work?
          content: |
            I love the challenge of solving complex problems through design and technology. It's incredibly rewarding to see people interact with something I've created and find it genuinely useful and easy to navigate. Bridging the gap between user needs and technical possibilities is what truly excites me.
        - label: What are your hobbies outside of work?
          content: |
            When I'm not designing or coding, I mostly stay home — books, films and games. I'm also passionate about music and occasionally contribute to open-source projects
        - label: What technical directions might you explore next?
          content: |
            Quantitative finance, red team of cybersecurity, 3D, game dev, desktop and mobile apps, Web3, and deeper work on OS, databases, and middleware.
