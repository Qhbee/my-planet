title: About Me
description: A fuller picture of me — my interests, my work, and my life.
content: |
  Hi, I'm **Qhbee**.

  ### My Intellectual Pursuits

  I've been curious about almost everything since I was a kid — I wanted to be a generalist with an insatiable appetite for human knowledge, from natural science and engineering to social science and the arts.

  As I've grown, my focus keeps shifting. Right now I'm strongest in statistics and software development, and I'll keep branching into new areas.

  ### What Drives Me

  What sustains my enthusiasm is the satisfaction of learning something new, the joy of turning messy ideas into clean solutions, and the accomplishment when something ships and actually helps someone.

  ### Beyond the Screen

  Outside of work, I am a homebody who enjoys movies and games. However, what matters more to me now is study in pursuit of truth, or building personal projects in service of the ideals I believe in.

  Thanks for stopping by. Feel free to browse my [projects](/en/projects) or [get in touch](/en/#contact) if you'd like to collaborate!
