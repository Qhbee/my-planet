faq:
  title: 常见问题
  description: 关于本站情况、服务与合作方式与个人习惯的简要说明。
  categories:
    - title: 关于本站
      questions:
        - label: 这个网站的定位是什么？
          content: |
            以博客随笔、项目展示为主的个人兴趣天地。
        - label: 这个网站如何对待隐私与数据？
          content: |
            本站以静态内容为主。除应用模块特定功能（如账号服务）所必需外，不收集访客的个人可识别信息。
            数据仅在实现功能及保障安全所必需的范围内处理。本人承诺不私自查阅或挪用数据，亦不将其转售、公开或提供给任何第三方。
    - title: 服务、报价与周期
      questions:
        - label: 你提供哪些服务？
          content: |
            我专注 Web 前后端开发、AI 应用开发、统计建模分析、深度学习算法。
        - label: 你的工作流程是怎样的？
          content: |
            我的工作流程强调协作化与迭代式。通常涵盖了探索与研究、方案构思与原型制作、用户测试、视觉设计，以及在落地实现阶段与开发团队的紧密配合。我会根据具体的项目需求灵活定制流程，始终致力于提供以用户为中心的解决方案。
        - label: 你会接受和初创团队的合作吗？
          content: |
            当然！我乐于在业余时间无偿参与，只要我认为这个项目真的有意义，并且我感兴趣。
        - label: 项目一般多少钱？
          content: |
            费用取决于范围、复杂度、功能与周期。完整的开发项目，合作通常从约 5,000 元起，常见项目在 8,000 至 25,000 元之间。咨询或单项设计按天计费，日费率 700 元。
        - label: 付款方式是什么？
          content: |
            我一般要求预付 40% 以排期并开工，其余 60% 在项目完成并交付后支付。接受微信、支付宝支付。
        - label: 一个项目通常要多久？
          content: |
            周期很大程度取决于范围与复杂度。较小项目可能 3~4 周，较大项目可能 2~4 个月。我会在初步调研后给出明确的时间估算。
        - label: 是否提供长期合作或持续支持？
          content: |
            提供。若有持续的设计支持、功能迭代或运维需求，可按月商定合作范围；具体内容与节奏欢迎另行沟通。
    - title: 关于我
      questions:
        - label: 工作中你最享受什么？
          content: |
            我喜欢用设计与技术解决复杂问题的挑战。看到人们使用我做出的东西，觉得真好用，非常有成就感。连接用户需求与技术可能，是最让我兴奋的事。
        - label: 工作之外你有什么爱好？
          content: |
            不设计、不写代码时，我也喜欢宅在家里，读书、观影或者游戏。我也热衷音乐，并偶尔参与开源项目。
        - label: 你未来可能会探索哪些技术方向？
          content: |
            金融量化、网络安全红队、3D 技术、游戏开发、桌面/手机应用、Web3、OS/DB/中间件研究
