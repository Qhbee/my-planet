title: 关于我
description: 了解全面的我，我的兴趣，我的工作，以及我的生活。
content: |
  你好，我是 **Qhbee**。

  ### 探索方向

  我的兴趣从小就很广泛，希望自己成为全才，对一切人类的知识都有贪婪的渴望。不管自然科学、工程技术，还是社会科学、人文艺术。

  但随着个人成长，最关注的点会不断转移，目前真正算擅长的是统计学和软件开发，未来还会不断探索其他方向。

  ### 我的动力

  让我对工作保持热情的是学习新知识的满足、把复杂想法转化为简洁优雅方案的喜悦、最终动手让设计落地并知道它对别人有帮助的成就感。

  ### 工作之外

  不用上班的时候，我大概率宅在家里，放松方式一般是看电影、打游戏。但是目前更重要的是读书学习、追求真理，或者写自己的项目、为理想而奋斗！

  ###

  感谢到访。欢迎浏览我的[项目](/zh/projects)，若有合作意向也可[联系我](/zh/#contact)！
